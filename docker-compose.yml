version: '3.8'

services:
  api:
    build:
      context: .
    # CRITICAL: Do NOT use 'ports' here.
    # The host machine must not be able to connect to localhost:8000 directly.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    ports:
      # External traffic enters through the reverse proxy
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
